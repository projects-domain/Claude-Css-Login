  <title>Claude</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="left">
        <h2>Convert your ideas into successful business.</h2>
      </div>

      <div class="right">
        <h1>Get Started</h1>
        <p class="subtitle">Welcome to HextaStudio — Let's get started</p>
        <div class="line"></div>

        <form>
          <div class="field">
            <label for="email">Your email</label>
            <input type="email" id="email" value="">
          </div>

          <div class="field">
            <label for="password">Create new password</label>
            <input type="password" id="password" value="">
          </div>

          <button type="submit">Create new account</button>
        </form>

        <p class="login">Already have account? <a class="login1" href="/login">Login</a></p>
      </div>

    </div>
  </div>
</body>
